name: release

# Manual release flow:
#   1. Trigger via Actions tab -> "Run workflow" -> enter version (e.g. 0.0.1)
#      or via CLI: gh workflow run release.yml -f version=0.0.1
#   2. Workflow stamps version into plugin.json (in CI only), pushes an orphan
#      release branch with install-ready files, creates the
#      agent-unity-wrapper--v{version} tag on that commit, and publishes a
#      GitHub Release with the zip attached.
#   3. The workflow then notifies agent-marketplace directly via
#      MARKETPLACE_DISPATCH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          NUMID='(0|[1-9][0-9]*)'
          PREID='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if [[ ! "$V" =~ ^${NUMID}\.${NUMID}\.${NUMID}(-${PREID}(\.${PREID})*)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE], no build metadata, no leading zeros)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if tag already exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      # Resolves the previous release tag (for release-notes diffing below)
      # and validates the src/<TAG> marker contract before anything is
      # staged/pushed. Pure local decision logic - no gh/network calls - so
      # it belongs before any mutating step. fetch-depth: 0 on the checkout
      # above already gives `git tag --list` the full tag history it needs.
      - name: Pre-flight - resolve previous release tag and validate src/<TAG> markers
        id: preflight
        shell: bash
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          PREV_TAG=$(git tag --list | .github/scripts/prev-release-tag.sh "$PLUGIN_NAME" "${{ inputs.version }}")
          git tag --list | .github/scripts/preflight-check.sh "$TAG" "$PREV_TAG"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into plugin manifests (in CI only)
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"

      - name: Stage install tree and build release zip
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-unity-wrapper"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/.codex-plugin" "$STAGE/skills"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp .codex-plugin/plugin.json  "$STAGE/.codex-plugin/"
          cp -a skills/. "$STAGE/skills/"
          cp -a scripts "$STAGE/"
          cp -a hooks "$STAGE/"
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          # assets/ goes onto the orphan release branch so the dispatch
          # payload's icon URL (raw.githubusercontent.com/${repo}/${TAG}/
          # assets/icon.png) resolves.
          [ -d assets ] && cp -a assets "$STAGE/" || true
          # description.md ships onto the orphan release branch so the dispatch
          # payload's description_url resolves at the tagged commit.
          [ -f description.md ] && cp -a description.md "$STAGE/" || true
          # .gitattributes ships onto the orphan release branch so a Windows
          # install (core.autocrlf=true) checks out SKILL.md with LF; Claude
          # Code silently ignores CRLF skill/instruction files.
          [ -f .gitattributes ] && cp .gitattributes "$STAGE/" || true

          mkdir -p dist
          ZIPNAME="agent-unity-wrapper-${{ inputs.version }}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/$ZIPNAME" .)

          echo "stage=$STAGE"      >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.zip }}"
          TAG="${{ steps.preflight.outputs.tag }}"
          PREV_TAG="${{ steps.preflight.outputs.prev_tag }}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::staging dir $STAGE not produced"; exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::release zip $ZIP not produced"
            ls -la dist/ || true
            exit 1
          fi

          # Capture the main-branch commit now, before the orphan checkout
          # below replaces the working tree - src/<TAG> marks this commit,
          # and release-notes generation diffs against it.
          MAIN_SHA=$(git rev-parse HEAD)

          # Stash the staging tree, the release zip, AND .github/scripts/
          # outside the worktree, since "git checkout --orphan" + clean will
          # wipe dist/ and .github/ before we attach the zip to the GitHub
          # Release / call the scripts again from the dispatch step below.
          TMP=$(mktemp -d)
          cp -a "$STAGE"/. "$TMP/"
          mkdir -p "$TMP/.github/scripts"
          cp -a .github/scripts/. "$TMP/.github/scripts/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"
          echo "tmp_dir=$TMP" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push the src/<TAG> marker unconditionally (pre-flight already
          # proved it doesn't exist yet), pointing at the unmodified
          # main-branch commit. This is what makes real release-notes
          # generation possible below: the orphan `release` branch shares no
          # history with `main`, so two orphan-branch tags have no
          # merge-base to diff - two src/<TAG> tags on `main` do.
          git tag "src/${TAG}" "$MAIN_SHA"
          git push origin "src/${TAG}"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .
          # .github/ was stashed above only so the dispatch step can reach
          # the scripts after this checkout - it is not an install-ready
          # file and must not land on the orphan release branch.
          rm -rf ./.github

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          # `gh release create --generate-notes` / `--notes-start-tag` can't
          # be used on the orphan release commit/tag: the orphan branch has
          # no merge-base with `main` or with any previous orphan release,
          # so GitHub has no commit range to summarize. Diffing the
          # src/<TAG> markers on `main` instead gives it two real, connected
          # commits.
          NOTES_ARGS=(-f tag_name="src/${TAG}" -f target_commitish="$MAIN_SHA")
          if [ -n "$PREV_TAG" ]; then
            NOTES_ARGS+=(-f previous_tag_name="src/${PREV_TAG}")
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" "${NOTES_ARGS[@]}" --jq .body > "$RUNNER_TEMP/notes.md"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.preflight.outputs.tag }}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:  ${{ inputs.version }}
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          TAG="${{ steps.preflight.outputs.tag }}"
          REPO="${{ github.repository }}"
          TMP="${{ steps.rel.outputs.tmp_dir }}"

          # `gh release view --jq .body` strips a real trailing newline the
          # same way it "strips" an absent one, so the "&& printf x" / strip
          # -x dance (not ";") is needed to tell the two apart - errexit
          # does not propagate failure out of a `$(...)` substitution.
          CHANGELOG=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body && printf x)
          CHANGELOG="${CHANGELOG%x}"
          CHANGELOG="${CHANGELOG%$'\n'}"

          PAYLOAD=$(NAME="$NAME" DESC="$DESC" REPO="$REPO" CATEGORY="skill" VERSION="$VERSION" TAG="$TAG" CHANGELOG="$CHANGELOG" \
            "$TMP/.github/scripts/marketplace-payload.sh")

          # Staging first (lands straight to main, no review), then the
          # curated marketplace (opens a review PR) -- same payload, two
          # independent dispatches.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory-staging/dispatches \
            -d "$PAYLOAD"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/seretos-agents/modular-software-factory/dispatches \
            -d "$PAYLOAD"
